[package]
name = "alsp-cli"
description = "alsp: evidence for coding agents reviewing a diff (callers, tests, coverage, predicted test gaps)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["code-review", "agents", "cli", "rust-analyzer", "coverage"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "alsp"
path = "src/main.rs"

[dependencies]
alsp-decide = { path = "../alsp-decide" }
alsp-index = { path = "../alsp-index" }
alsp-evidence = { path = "../alsp-evidence" }
alsp-coverage = { path = "../alsp-coverage" }
alsp-gaps = { path = "../alsp-gaps" }
alsp-query = { path = "../alsp-query" }
alsp-review = { path = "../alsp-review" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
alsp-coverage = { path = "../alsp-coverage", features = ["testkit"] }
alsp-evidence = { path = "../alsp-evidence", features = ["testkit"] }
tempfile.workspace = true
alsp-decide = { path = "../alsp-decide", features = ["testkit"] }
