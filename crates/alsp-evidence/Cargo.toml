[package]
name = "alsp-evidence"
description = "Evidence pack for a git diff: changed symbols, type-resolved callers, entry points"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
# A tiny name-based indexer that turns in-memory sources into a SCIP index, so tests (here and in
# alsp-cli) can run the whole pack pipeline without rust-analyzer.
testkit = ["dep:scip", "dep:protobuf"]

[dependencies]
alsp-index = { path = "../alsp-index" }
scip = { workspace = true, optional = true }
protobuf = { workspace = true, optional = true }
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
proc-macro2.workspace = true

[dev-dependencies]
# Self dev-dependency: turns the testkit on for this crate's own tests.
alsp-evidence = { path = ".", features = ["testkit"] }
tempfile.workspace = true
